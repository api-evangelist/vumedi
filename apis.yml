aid: vumedi
name: VuMedi
description: 'VuMedi (Vumedi, Inc.) operates a video education platform for physicians
  and other healthcare professionals. Founded in 2008 and headquartered in Oakland,
  California, with offices in Saint Louis Park, Minnesota and Zagreb, Croatia, the
  platform aggregates a library of long-form educational videos, webinars, conference
  coverage and case discussions contributed by key opinion leaders and academic medical
  centers across more than twenty-five clinical specialties. Physicians use it to
  watch surgical technique videos, follow live and on-demand webinars, discuss cases
  with peers and presenters, and stay current on clinical evidence. The company monetizes
  through industry partnerships with pharmaceutical and medical-device brands rather
  than a subscription paywall. As of August 2026 VuMedi publishes no public developer
  program, API documentation, machine-readable API contract, SDKs or MCP server; its
  public surface is the consumer web application, an iOS app, and a set of static
  marketing and policy pages.'
